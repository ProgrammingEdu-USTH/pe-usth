      <div class="l"><button class="apple" id="apple" aria-haspopup="menu" aria-label="Menu máy">☾</button><b id="appName">Finder</b><span>Tệp</span><span>Sửa</span><span>Xem</span><span>Cửa sổ</span><span>Trợ giúp</span></div>
      <div class="r">
                <svg viewBox="0 0 16 16" fill="#fff"><path d="M8 12.5a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4zM3.4 9.6a6.5 6.5 0 0 1 9.2 0l-1.1 1.1a5 5 0 0 0-7 0zM1 7.2a9.9 9.9 0 0 1 14 0l-1.1 1.1a8.4 8.4 0 0 0-11.8 0z"/></svg>
                <svg viewBox="0 0 24 12"><rect x=".5" y=".5" width="20" height="11" rx="3" fill="none" stroke="#fff" opacity=".6"/><rect x="2" y="2" width="14" height="8" rx="1.5" fill="#fff"/><rect x="21.5" y="4" width="1.5" height="4" rx=".7" fill="#fff" opacity=".6"/></svg>
                <span id="clock">T5 21:30</span>
      </div>
    </div>
    <div class="appmenu" id="appmenu" hidden role="menu">

    <div class="icons" id="icons"></div>
    <div id="wins"></div>
    <div class="notes" id="notes"></div>

  </div>
</div>
