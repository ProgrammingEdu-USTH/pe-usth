<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lofi Lesson Reader — 5 Màn Đọc & Bộ Asset (Preview)</title>
  <style>
    :root {
      --lf-bg-deep: #120d24;
      --lf-bg-mid: #1b1435;
      --lf-bg-dusk: #271c4a;
      --lf-card-bg: rgba(31, 23, 56, 0.86);
      --lf-card-bg-strong: rgba(25, 18, 46, 0.94);
      --lf-card-border: rgba(255, 226, 184, 0.16);
      --lf-card-border-hi: rgba(255, 214, 153, 0.42);
      --lf-ink: #f7f2ff;
      --lf-ink-soft: #cfc3e8;
      --lf-ink-muted: #9889b8;
      --lf-amber: #f6b86b;
      --lf-amber-deep: #e88c5d;
      --lf-sakura: #e58cc8;
      --lf-violet: #a98cf5;
      --lf-mint: #5cd6a9;
      --lf-mint-bg: rgba(92, 214, 169, 0.14);
      --lf-rose: #f2778d;
      --lf-rose-bg: rgba(242, 119, 141, 0.14);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif;
      color: var(--lf-ink);
      background:
        radial-gradient(ellipse 80% 55% at 50% 0%, rgba(124, 83, 198, 0.28), transparent 65%),
        radial-gradient(ellipse 65% 50% at 18% 92%, rgba(246, 184, 107, 0.16), transparent 60%),
        linear-gradient(180deg, var(--lf-bg-deep) 0%, var(--lf-bg-mid) 52%, var(--lf-bg-dusk) 100%);
      overflow-x: hidden;
    }

    /* Lofi Animated Backdrop */
    .backdrop {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .scene-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center bottom;
      opacity: 0.44;
      filter: saturate(1.08) contrast(1.02);
    }
    .vignette {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 62% 54% at 50% 46%, rgba(18, 13, 36, 0.22) 0%, rgba(18, 13, 36, 0.72) 100%),
        linear-gradient(180deg, rgba(16, 11, 32, 0.55) 0%, rgba(22, 15, 42, 0.22) 45%, rgba(14, 9, 28, 0.78) 100%);
    }
    .string-lights {
      position: absolute;
      top: 52px;
      left: 50%;
      transform: translateX(-50%);
      width: min(1440px, 100vw);
      opacity: 0.88;
      filter: drop-shadow(0 6px 16px rgba(246, 184, 107, 0.35));
    }
    .moon {
      position: absolute;
      top: 76px;
      right: clamp(24px, 7vw, 120px);
      width: 118px;
      height: 118px;
      opacity: 0.88;
      animation: floatSlow 9s ease-in-out infinite;
    }
    .lamp {
      position: absolute;
      left: clamp(8px, 3vw, 56px);
      bottom: 44px;
      width: 185px;
      opacity: 0.92;
      filter: drop-shadow(0 12px 28px rgba(246, 184, 107, 0.26));
    }
    .plant {
      position: absolute;
      right: clamp(12px, 3.5vw, 68px);
      bottom: 44px;
      width: 145px;
      opacity: 0.9;
      transform-origin: bottom center;
      animation: swaySlow 7s ease-in-out infinite;
    }
    .star {
      position: absolute;
      border-radius: 50%;
      background: #fff6db;
      box-shadow: 0 0 8px rgba(255, 232, 179, 0.85);
      animation: twinkle 3.6s ease-in-out infinite;
    }
    .mote {
      position: absolute;
      width: 24px;
      height: 24px;
      background-image: url('./lofi-lesson-pack/sprites/props.webp');
      background-size: 192px 24px;
      background-repeat: no-repeat;
      opacity: 0.72;
      animation: floatUp 11s ease-in-out infinite;
    }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @keyframes swaySlow {
      0%, 100% { transform: rotate(-1.2deg); }
      50% { transform: rotate(1.4deg); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.25; transform: scale(0.85); }
      50% { opacity: 0.95; transform: scale(1.15); }
    }
    @keyframes floatUp {
      0%, 100% { transform: translateY(0) scale(0.95); opacity: 0.45; }
      50% { transform: translateY(-16px) scale(1.06); opacity: 0.85; }
    }

    /* Chrome Shell */
    .chrome {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      height: 60px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: rgba(19, 13, 38, 0.82);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 226, 184, 0.14);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 14px;
      color: var(--lf-ink);
    }
    .brand-tag {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      background: rgba(246, 184, 107, 0.16);
      border: 1px solid rgba(246, 184, 107, 0.35);
      color: var(--lf-amber);
    }
    .switcher {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .tab-btn {
      appearance: none;
      border: 1px solid rgba(255, 226, 184, 0.16);
      background: rgba(34, 24, 62, 0.75);
      color: var(--lf-ink-soft);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.16s ease;
    }
    .tab-btn:hover {
      border-color: rgba(246, 184, 107, 0.45);
      color: var(--lf-ink);
    }
    .tab-btn.active {
      background: linear-gradient(135deg, #f6b86b 0%, #e88c5d 100%);
      color: #1c102b;
      border-color: rgba(255, 232, 194, 0.65);
      font-weight: 800;
      box-shadow: 0 4px 14px rgba(246, 184, 107, 0.35);
    }
    .streak {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 700;
      background: rgba(246, 184, 107, 0.15);
      border: 1px solid rgba(246, 184, 107, 0.32);
      color: #ffd599;
    }

    /* Progress Bar Row */
    .progress-row {
      max-width: 760px;
      width: 100%;
      margin: 14px auto 0;
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .seg {
      flex: 1;
      height: 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
      cursor: pointer;
      border: none;
      padding: 0;
    }
    .seg.done {
      background: linear-gradient(90deg, #f6b86b, #e88c5d);
    }
    .seg.current {
      background: linear-gradient(90deg, #f6b86b, #e58cc8);
      box-shadow: 0 0 12px rgba(246, 184, 107, 0.5);
    }
    .seg-count {
      font-size: 12px;
      font-weight: 700;
      color: var(--lf-ink-soft);
      margin-left: 6px;
    }

    /* Main Stage */
    .stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 20px 92px;
    }
    .shell-card {
      position: relative;
      width: min(760px, 100%);
      background: var(--lf-card-bg);
      backdrop-filter: blur(18px);
      border: 1px solid var(--lf-card-border);
      border-radius: 20px;
      padding: 28px 30px 26px;
      box-shadow:
        0 20px 50px rgba(8, 4, 20, 0.58),
        0 0 0 1px rgba(255, 240, 210, 0.06) inset,
        0 1px 0 rgba(255, 240, 210, 0.16) inset;
      overflow: hidden;
    }
    .shell-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #f6b86b, #e58cc8, #a98cf5);
    }
    .washi {
      position: absolute;
      top: -6px;
      left: 28px;
      width: 96px;
      opacity: 0.85;
      pointer-events: none;
    }
    .bookmark {
      position: absolute;
      top: 0;
      right: 34px;
      width: 24px;
      transform-origin: top center;
      animation: swaySlow 5s ease-in-out infinite;
      pointer-events: none;
    }
    .scene-banner {
      position: absolute;
      top: 0;
      right: 0;
      width: 240px;
      height: 96px;
      object-fit: cover;
      opacity: 0.42;
      mask-image: radial-gradient(ellipse 90% 90% at 85% 20%, #000 35%, transparent 78%);
      -webkit-mask-image: radial-gradient(ellipse 90% 90% at 85% 20%, #000 35%, transparent 78%);
      pointer-events: none;
    }

    .head-row {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }
    .scene-badge {
      width: 52px;
      height: 52px;
      flex-shrink: 0;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.35));
    }
    .eyebrow {
      font-size: 11.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--lf-amber);
      margin-bottom: 4px;
    }
    .title {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
      line-height: 1.3;
      color: var(--lf-ink);
    }

    /* Content Blocks */
    .prose {
      font-size: 15.5px;
      line-height: 1.72;
      color: var(--lf-ink-soft);
    }
    .prose p { margin: 0 0 12px; }
    .prose strong { color: #ffe2b8; }
    .inline-code {
      font-family: 'JetBrains Mono', Consolas, monospace;
      font-size: 0.9em;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(169, 140, 245, 0.16);
      border: 1px solid rgba(169, 140, 245, 0.28);
      color: #f6d59e;
    }
    .open-book-callout {
      margin-top: 14px;
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(246, 184, 107, 0.1);
      border: 1px solid rgba(246, 184, 107, 0.28);
      color: #f9e6c7;
      font-size: 14.5px;
    }
    .code-box {
      margin: 14px 0;
      padding: 16px 18px;
      border-radius: 14px;
      background: #110b22;
      border: 1px solid rgba(169, 140, 245, 0.26);
      font-family: 'JetBrains Mono', Consolas, monospace;
      font-size: 14px;
      line-height: 1.65;
      color: #f3ecff;
      overflow-x: auto;
    }
    .code-comment { color: #8c7db0; }
    .code-num { color: #f6b86b; }
    .code-fn { color: #9ad1ff; }
    .output-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 10px;
      background: rgba(92, 214, 169, 0.14);
      border: 1px solid rgba(92, 214, 169, 0.35);
      color: #9bf2d0;
      font-family: 'JetBrains Mono', Consolas, monospace;
      font-size: 13px;
    }

    /* Options Grid */
    .options-list {
      display: grid;
      gap: 10px;
      margin-top: 16px;
    }
    .opt-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      text-align: left;
      padding: 13px 16px;
      border-radius: 14px;
      background: rgba(41, 30, 74, 0.72);
      border: 1.5px solid rgba(255, 226, 184, 0.16);
      color: var(--lf-ink);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .opt-btn:hover {
      border-color: rgba(246, 184, 107, 0.5);
      background: rgba(54, 39, 96, 0.84);
      transform: translateY(-1px);
    }
    .opt-btn.selected {
      border-color: var(--lf-amber);
      background: rgba(246, 184, 107, 0.16);
    }
    .opt-btn.correct {
      border-color: var(--lf-mint);
      background: var(--lf-mint-bg);
      color: #d4fff0;
    }
    .opt-btn.wrong {
      border-color: var(--lf-rose);
      background: var(--lf-rose-bg);
    }
    .opt-key {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12.5px;
      font-weight: 800;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 226, 184, 0.2);
      color: var(--lf-amber);
      flex-shrink: 0;
    }
    .explain-box {
      margin-top: 14px;
      padding: 13px 16px;
      border-radius: 12px;
      background: rgba(92, 214, 169, 0.12);
      border: 1px solid rgba(92, 214, 169, 0.35);
      color: #d7fff0;
      font-size: 14px;
      line-height: 1.55;
    }

    /* Recap Stats */
    .recap-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 18px 0;
    }
    .stat-card {
      padding: 14px;
      border-radius: 14px;
      background: rgba(41, 30, 74, 0.72);
      border: 1px solid rgba(255, 226, 184, 0.16);
      text-align: center;
    }
    .stat-val {
      font-size: 24px;
      font-weight: 800;
      color: var(--lf-amber);
    }
    .stat-lbl {
      font-size: 12px;
      color: var(--lf-ink-soft);
      margin-top: 4px;
    }

    /* Bottom Action Bar */
    .bottombar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 72px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(17, 12, 34, 0.86);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 226, 184, 0.14);
      z-index: 2;
    }
    .status-note {
      font-size: 13px;
      color: var(--lf-ink-soft);
    }
    .cta-group {
      display: flex;
      gap: 10px;
    }
    .btn-secondary {
      padding: 11px 18px;
      border-radius: 999px;
      border: 1px solid rgba(255, 226, 184, 0.22);
      background: rgba(41, 30, 74, 0.75);
      color: var(--lf-ink);
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-primary {
      padding: 11px 26px;
      border-radius: 999px;
      border: 1px solid rgba(255, 234, 198, 0.65);
      background: linear-gradient(135deg, #f6b86b 0%, #e88c5d 100%);
      color: #1c102b;
      font-weight: 800;
      font-size: 14.5px;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(246, 184, 107, 0.36);
    }

    /* Asset Kit View */
    .asset-board {
      width: min(1080px, 100%);
      background: var(--lf-card-bg-strong);
      border: 1px solid var(--lf-card-border);
      border-radius: 20px;
      padding: 26px 28px;
      box-shadow: 0 20px 50px rgba(8, 4, 20, 0.65);
    }
    .asset-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 12px;
      margin: 16px 0 24px;
    }
    .asset-item {
      padding: 12px;
      border-radius: 14px;
      background: rgba(41, 30, 74, 0.65);
      border: 1px solid rgba(255, 226, 184, 0.14);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 8px;
    }
    .asset-item img {
      max-width: 100%;
      max-height: 76px;
      object-fit: contain;
    }
    .asset-name {
      font-family: 'JetBrains Mono', Consolas, monospace;
      font-size: 11.5px;
      color: #ffd599;
    }
    .asset-meta {
      font-size: 11px;
      color: var(--lf-ink-soft);
    }
    table.asset-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-top: 12px;
    }
    table.asset-table th, table.asset-table td {
      padding: 9px 12px;
      border-bottom: 1px solid rgba(255, 226, 184, 0.12);
      text-align: left;
    }
    table.asset-table th {
      color: var(--lf-amber);
      font-weight: 700;
      background: rgba(255, 255, 255, 0.04);
    }
  </style>
</head>
<body>
  <!-- Animated Lofi Backdrop -->
  <div class="backdrop" aria-hidden="true">
    <picture>
      <source media="(max-width: 768px)" srcset="./lofi-lesson-pack/scenes/night-desk-720.webp" />
      <img class="scene-img" src="./lofi-lesson-pack/scenes/night-desk-1600.webp" alt="" />
    </picture>
    <div class="vignette"></div>
    <img class="string-lights" src="./lofi-lesson-pack/svg/string-lights.svg" alt="" />
    <img class="moon" src="./lofi-lesson-pack/svg/moon.svg" alt="" />
    <img class="lamp" src="./lofi-lesson-pack/svg/lamp.svg" alt="" />
    <img class="plant" src="./lofi-lesson-pack/svg/plant.svg" alt="" />
    <span class="star" style="left:12%;top:18%;width:3px;height:3px;animation-delay:0.2s"></span>
    <span class="star" style="left:24%;top:12%;width:4px;height:4px;animation-delay:1.1s"></span>
    <span class="star" style="left:68%;top:16%;width:3px;height:3px;animation-delay:0.7s"></span>
    <span class="star" style="left:82%;top:22%;width:4px;height:4px;animation-delay:1.8s"></span>
    <span class="mote" style="left:18%;top:64%;background-position:0 0;animation-delay:0s"></span>
    <span class="mote" style="left:78%;top:58%;background-position:-24px 0;animation-delay:1.6s"></span>
    <span class="mote" style="left:28%;top:42%;background-position:-96px 0;animation-delay:2.8s"></span>
  </div>

  <div class="chrome">
    <header class="topbar">
      <div class="brand">
        <span class="brand-tag">M1 · BÀI 1/179</span>
        <span>Chạy một phép tính và đọc kết quả</span>
      </div>
      <nav class="switcher" aria-label="Chuyển màn đọc">
        <button class="tab-btn active" onclick="setStep(0)">1. Lý thuyết (Sách mở)</button>
        <button class="tab-btn" onclick="setStep(1)">2. Ví dụ</button>
        <button class="tab-btn" onclick="setStep(2)">3. Dự đoán kết quả</button>
        <button class="tab-btn" onclick="setStep(3)">4. Trắc nghiệm</button>
        <button class="tab-btn" onclick="setStep(4)">5. Tóm tắt</button>
        <button class="tab-btn" onclick="setStep(5)">📦 Bảng Asset & Kit</button>
      </nav>
      <div class="streak">🔥 Chuỗi 3 ngày · +40 XP</div>
    </header>

    <div class="progress-row" id="progressRow"></div>

    <main class="stage" id="stageContainer"></main>

    <footer class="bottombar">
      <div class="status-note" id="statusNote">✓ Tiến độ tự lưu · Góc học Lofi</div>
      <div class="cta-group">
        <button class="btn-secondary" onclick="prevStep()">← Màn trước</button>
        <button class="btn-primary" id="primaryBtn" onclick="nextStep()">Tiếp tục →</button>
      </div>
    </footer>
  </div>

  <script>
    let currentStep = 0;
    let selectedOption = null;
    let checkedAnswer = false;

    const steps = [
      {
        scene: 'theory',
        eyebrow: 'BÀI ĐỌC · SÁCH MỞ',
        title: 'Python như một cuốn sổ tính tương tác trên bàn học',
        badge: './lofi-lesson-pack/svg/badge-theory.svg',
        banner: './lofi-lesson-pack/scenes/banner-theory.webp',
        bookmark: true,
        render: () => `
          <div class="prose">
            <p>Khi mở <strong>Python REPL</strong> hoặc một ô lệnh trong phòng học này, bạn có thể viết thẳng một biểu thức số học như <span class="inline-code">24 * 7</span> rồi nhấn chạy để nhận kết quả ngay lập tức.</p>
            <p>Thứ tự ưu tiên toán tử trong Python tuân theo quy tắc quen thuộc: ngoặc tròn <span class="inline-code">()</span> được tính trước, tiếp theo là lũy thừa <span class="inline-code">**</span>, nhân/chia <span class="inline-code">* / // %</span> và cuối cùng là cộng/trừ <span class="inline-code">+ -</span>.</p>
            <div class="open-book-callout">
              📖 <strong>Ghi chú bên lề sách:</strong> Phép chia <span class="inline-code">/</span> luôn trả về số thực (<span class="inline-code">float</span>), còn phép chia lấy phần nguyên <span class="inline-code">//</span> giữ lại phần nguyên đã làm tròn xuống.
            </div>
          </div>
        `
      },
      {
        scene: 'example',
        eyebrow: 'BÀI ĐỌC · VÍ DỤ',
        title: 'Ví dụ: Tính tổng thời lượng tự học trong tuần',
        badge: './lofi-lesson-pack/svg/badge-example.svg',
        banner: './lofi-lesson-pack/scenes/banner-example.webp',
        bookmark: false,
        render: () => `
          <div class="prose">
            <p>Quan sát đoạn mã dưới đây khi tính tổng số phút học trong 5 ngày trong tuần cộng thêm buổi ôn tập cuối tuần:</p>
            <pre class="code-box"><span class="code-comment"># 5 buổi tối (mỗi buổi 25 phút) + 1 buổi cuối tuần (40 phút)</span>
phut_moi_buoi = <span class="code-num">25</span>
so_buoi = <span class="code-num">5</span>
tong_phut = phut_moi_buoi * so_buoi + <span class="code-num">40</span>
<span class="code-fn">print</span>(tong_phut)</pre>
            <div class="output-pill">▶ Kết quả in ra: <strong>165</strong></div>
          </div>
        `
      },
      {
        scene: 'predict',
        eyebrow: 'DỰ ĐOÁN KẾT QUẢ',
        title: 'Đoạn mã sau sẽ in ra giá trị nào?',
        badge: './lofi-lesson-pack/svg/badge-predict.svg',
        banner: './lofi-lesson-pack/scenes/banner-predict.webp',
        bookmark: false,
        options: ['14', '20', '9', '24'],
        correctIndex: 0,
        explanation: 'Chính xác! Phép nhân 3 * 4 = 12 được thực hiện trước, sau đó cộng 2 thành 14.',
        render: function() {
          return `
            <div class="prose">
              <p>Hãy nhẩm thứ tự thực hiện phép tính trước khi bấm chọn đáp án:</p>
              <pre class="code-box">ket_qua = <span class="code-num">2</span> + <span class="code-num">3</span> * <span class="code-num">4</span>
<span class="code-fn">print</span>(ket_qua)</pre>
            </div>
            ${renderOptions(this)}
          `;
        }
      },
      {
        scene: 'quiz',
        eyebrow: 'TRẮC NGHIỆM',
        title: 'Toán tử nào dùng để chia lấy phần nguyên trong Python?',
        badge: './lofi-lesson-pack/svg/badge-quiz.svg',
        banner: './lofi-lesson-pack/scenes/banner-quiz.webp',
        bookmark: false,
        options: [
          '// (hai dấu gạch chéo)',
          '/ (một dấu gạch chéo)',
          '% (dấu phần trăm)',
          '** (hai dấu sao)'
        ],
        correctIndex: 0,
        explanation: 'Chính xác! Toán tử // trả về thương nguyên (ví dụ 7 // 2 == 3), còn % trả về số dư.',
        render: function() {
          return `
            <div class="prose">
              <p>Chọn đáp án đúng để chia <span class="inline-code">17</span> cho <span class="inline-code">5</span> và nhận về thương nguyên <span class="inline-code">3</span>:</p>
            </div>
            ${renderOptions(this)}
          `;
        }
      },
      {
        scene: 'recap',
        eyebrow: 'TÓM TẮT BÀI HỌC',
        title: 'Hoàn thành Bài 1 · Chạy một phép tính và đọc kết quả',
        badge: './lofi-lesson-pack/svg/badge-recap.svg',
        banner: './lofi-lesson-pack/scenes/banner-recap.webp',
        bookmark: false,
        render: () => `
          <div class="prose">
            <p>Bạn đã nắm vững cách chạy biểu thức số học, thứ tự ưu tiên toán tử và cách phân biệt <span class="inline-code">/</span>, <span class="inline-code">//</span>, <span class="inline-code">%</span> trong Python.</p>
          </div>
          <div class="recap-stats">
            <div class="stat-card">
              <div class="stat-val">5 / 5</div>
              <div class="stat-lbl">Màn học hoàn tất</div>
            </div>
            <div class="stat-card">
              <div class="stat-val">+40 XP</div>
              <div class="stat-lbl">Điểm kinh nghiệm</div>
            </div>
            <div class="stat-card">
              <div class="stat-val">100%</div>
              <div class="stat-lbl">Độ chính xác</div>
            </div>
          </div>
          <div class="open-book-callout">
            ✨ <strong>Điểm nhớ nhanh:</strong> Luôn dùng dấu ngoặc tròn <span class="inline-code">()</span> khi muốn làm rõ thứ tự tính toán cho người đọc mã.
          </div>
        `
      }
    ];

    function renderOptions(stepObj) {
      const keys = ['A', 'B', 'C', 'D'];
      const items = stepObj.options.map((opt, idx) => {
        let cls = 'opt-btn';
        if (selectedOption === idx) cls += ' selected';
        if (checkedAnswer) {
          if (idx === stepObj.correctIndex) cls += ' correct';
          else if (selectedOption === idx) cls += ' wrong';
        }
        return `<button class="${cls}" onclick="pickOption(${idx})">
          <span class="opt-key">${keys[idx]}</span>
          <span>${opt}</span>
        </button>`;
      }).join('');
      const exp = checkedAnswer ? `<div class="explain-box">✓ ${stepObj.explanation}</div>` : '';
      return `<div class="options-list">${items}</div>${exp}`;
    }

    function pickOption(idx) {
      selectedOption = idx;
      checkedAnswer = true;
      render();
    }

    function setStep(idx) {
      currentStep = idx;
      selectedOption = null;
      checkedAnswer = false;
      render();
    }

    function prevStep() {
      setStep((currentStep + 5) % 6);
    }

    function nextStep() {
      setStep((currentStep + 1) % 6);
    }

    function renderAssetBoard() {
      return `
        <section class="asset-board">
          <div class="eyebrow">BỘ ASSET ĐÃ XUẤT · SVG + WEBP + SPRITE</div>
          <h1 class="title" style="margin-bottom:6px">Thư mục: ./lofi-lesson-pack/ & frontend/public/lesson-lofi/</h1>
          <div class="asset-grid">
            <div class="asset-item"><img src="./lofi-lesson-pack/svg/badge-theory.svg" alt="" /><div class="asset-name">svg/badge-theory.svg</div><div class="asset-meta">SVG · 96×96 · Lý thuyết</div></div>
            <div class="asset-item"><img src="./lofi-lesson-pack/svg/badge-example.svg" alt="" /><div class="asset-name">svg/badge-example.svg</div><div class="asset-meta">SVG · 96×96 · Ví dụ</div></div>
            <div class="asset-item"><img src="./lofi-lesson-pack/svg/badge-predict.svg" alt="" /><div class="asset-name">svg/badge-predict.svg</div><div class="asset-meta">SVG · 96×96 · Dự đoán</div></div>
            <div class="asset-item"><img src="./lofi-lesson-pack/svg/badge-quiz.svg" alt="" /><div class="asset-name">svg/badge-quiz.svg</div><div class="asset-meta">SVG · 96×96 · Trắc nghiệm</div></div>
            <div class="asset-item"><img src="./lofi-lesson-pack/svg/badge-recap.svg" alt="" /><div class="asset-name">svg/badge-recap.svg</div><div class="asset-meta">SVG · 96×96 · Tóm tắt</div></div>
            <div class="asset-item"><img src="./lofi-lesson-pack/scenes/banner-theory.webp" alt="" /><div class="asset-name">scenes/banner-theory.webp</div><div class="asset-meta">WebP · 480×192 · Sách mở</div></div>
            <div class="asset-item"><img src="./lofi-lesson-pack/scenes/banner-example.webp" alt="" /><div class="asset-name">scenes/banner-example.webp</div><div class="asset-meta">WebP · 480×192 · Ví dụ</div></div>
            <div class="asset-item"><img src="./lofi-lesson-pack/scenes/banner-predict.webp" alt="" /><div class="asset-name">scenes/banner-predict.webp</div><div class="asset-meta">WebP · 480×192 · Dự đoán</div></div>
            <div class="asset-item"><img src="./lofi-lesson-pack/scenes/banner-quiz.webp" alt="" /><div class="asset-name">scenes/banner-quiz.webp</div><div class="asset-meta">WebP · 480×192 · Trắc nghiệm</div></div>
            <div class="asset-item"><img src="./lofi-lesson-pack/scenes/banner-recap.webp" alt="" /><div class="asset-name">scenes/banner-recap.webp</div><div class="asset-meta">WebP · 480×192 · Tóm tắt</div></div>
            <div class="asset-item"><img src="./lofi-lesson-pack/sprites/props.webp" alt="" /><div class="asset-name">sprites/props.webp</div><div class="asset-meta">Sprite WebP · 512×64 (8×64)</div></div>
            <div class="asset-item"><img src="./lofi-lesson-pack/svg/lamp.svg" alt="" /><div class="asset-name">svg/lamp.svg + plant.svg</div><div class="asset-meta">SVG · Đèn bàn & cây cảnh</div></div>
          </div>
          <table class="asset-table">
            <thead>
              <tr><th>Tên Asset</th><th>Định dạng</th><th>Kích thước</th><th>Nơi dùng</th></tr>
            </thead>
            <tbody>
              <tr><td><code>svg/badge-*.svg</code> (5 file)</td><td>SVG</td><td>96×96</td><td>Huy hiệu góc trái của 5 màn: Lý thuyết, Ví dụ, Dự đoán, Trắc nghiệm, Tóm tắt</td></tr>
              <tr><td><code>svg/moon.svg</code>, <code>string-lights.svg</code>, <code>lamp.svg</code>, <code>plant.svg</code></td><td>SVG</td><td>160×160 → 1440×72</td><td>Lớp cảnh nền động <code>LofiBackdrop.tsx</code></td></tr>
              <tr><td><code>svg/washi-tape.svg</code>, <code>bookmark.svg</code></td><td>SVG</td><td>120×34, 30×100</td><td>Trang trí mép thẻ bài học & dây đánh dấu sách mở (<code>ShellB.tsx</code>)</td></tr>
              <tr><td><code>scenes/night-desk-1600.webp</code> & <code>720.webp</code></td><td>WebP</td><td>1600×893, 720×1280</td><td>Cảnh phòng học lofi tím đậm (Desktop & Mobile)</td></tr>
              <tr><td><code>scenes/banner-*.webp</code> (5 file)</td><td>WebP</td><td>480×192</td><td>Banner minh họa góc trên bên phải của 5 loại màn học</td></tr>
              <tr><td><code>sprites/props.webp</code> + <code>props.json</code></td><td>Sprite WebP</td><td>512×64 (8 ô 64×64)</td><td>8 vật nhỏ: <code>star</code>, <code>sparkle</code>, <code>heart</code>, <code>flame</code>, <code>leaf</code>, <code>sticky</code>, <code>pencil</code>, <code>dot</code></td></tr>
            </tbody>
          </table>
        </section>
      `;
    }

    function render() {
      const tabs = document.querySelectorAll('.tab-btn');
      tabs.forEach((btn, i) => btn.classList.toggle('active', i === currentStep));

      const prog = document.getElementById('progressRow');
      if (currentStep < 5) {
        prog.style.display = 'flex';
        prog.innerHTML = steps.map((_, i) => {
          const cls = i < currentStep ? 'seg done' : (i === currentStep ? 'seg current' : 'seg');
          return `<button class="${cls}" onclick="setStep(${i})" title="Màn ${i + 1}"></button>`;
        }).join('') + `<span class="seg-count">${currentStep + 1}/5</span>`;
      } else {
        prog.style.display = 'none';
      }

      const stage = document.getElementById('stageContainer');
      if (currentStep === 5) {
        stage.innerHTML = renderAssetBoard();
        return;
      }

      const s = steps[currentStep];
      stage.innerHTML = `
        <article class="shell-card" data-scene="${s.scene}">
          <img class="washi" src="./lofi-lesson-pack/svg/washi-tape.svg" alt="" />
          <img class="scene-banner" src="${s.banner}" alt="" />
          ${s.bookmark ? `<img class="bookmark" src="./lofi-lesson-pack/svg/bookmark.svg" alt="" />` : ''}
          <header class="head-row">
            <img class="scene-badge" src="${s.badge}" alt="" />
            <div>
              <div class="eyebrow">${s.eyebrow}</div>
              <h1 class="title">${s.title}</h1>
            </div>
          </header>
          ${s.render()}
        </article>
      `;
    }

    render();
  </script>
</body>
</html>
